# Continuous Verification Gate for Signal Atlas Core
# Enforces AGENTS.md §11.1, §12.3, §12.4 and Audit Note N-21:
# - Branch protection (Note N-21): NOT VERIFIED from repository files alone (remote GitHub branch protection
#   settings cannot be computed or evidenced offline from repository clones; Rule 9.1, Note N-21).
#   Instead, `scripts/verify_audit_append_only.py` enforces local append-only history, tag integrity,
#   and zero-line-deletion audit checks on every verification run.

name: Continuous Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Repository Foundation & Verification Gate (AGENTS.md §12.3)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PyYAML>=6.0.0" "pytest>=8.0.0" "duckdb>=1.0.0" "pyarrow>=14.0.0"
          pip install -e .[all]

      - name: Run Full Offline Test Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q

      - name: Run Wave 0.5 Continuous Verification Gate
        env:
          PYTHONPATH: src
        run: |
          python scripts/verify_audit_append_only.py

