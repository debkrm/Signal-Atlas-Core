market_data_and_accounting_invariants:
  # Strict Decimal representation: Binary floating point prohibited in accounting
  # Minimum binding evaluation start date for research gating (Rule 10.8, Audit §40.5, Finding N-32)
  # Pre-2022 historical archives are unverified/absent from local storage and not bridged
  min_binding_evaluation_start_date: "2018-04-01"
  # Minimum required point-in-time symbol->ISIN resolution for actively traded EQ scrips per session (Finding H-54, Audit §41.3)
  # Audit measurement: 2,390,165 / 2,390,165 traded EQ rows across all 1,195 daily Bhavcopy sessions resolve 100.0000% with 0 failures
  min_traded_eq_resolution_pct: "100.0"
  # Audit §76.9 N-140 / Ruling 3: dataset completeness is a different quantity from row resolution —
  # the share of the research dataset's *instruments* that resolved to an authoritative ISIN at all.
  # Measured 196 / 211 = 92.8910% on EXP-DEV-2022-2024-V2, so this fails closed until the 15
  # unresolved instruments are named and accounted for. Wiring it here keeps the row measure and the
  # completeness measure from impersonating each other (§9.1).
  min_dataset_instrument_resolution_pct: "100.0"
  strict_decimal_accounting_required: true
  # Fail closed on unexplained gaps in price series
  fail_closed_on_unexplained_gaps: true
  # Point-in-time universe schedule required (zero survivorship bias)
  point_in_time_universe_required: true
  # Zero forward-filling or linear interpolation of missing OHLC records
  zero_data_fabrication_required: true

  # Finding H-72: Authoritative reference manifest fingerprint pinned as criteria anchor (Audit §54.5, §54.10, §60.6 Item 4, §62.6 Item 4)
  # MAN-FPR-V1 covers data/reference/manifest.jsonl content (1,867,504 bytes, SHA-256
  # 4b813090cab7f9be555833039029b1882dc60b05485fb83c0e9dcaba76609c1d); re-pinned 2026-11-18 under
  # Audit §94.6 item 1 / criteria 1.1.15, which registers the derived-layer SPLIT_BONUS_ADJUSTED corpus
  # `data/reference/historical_dataset_2018_2023.json.gz` as one current row (1,959 manifest rows =
  # 1,001 current + 958 superseded; the build's first row was superseded by its restated rebuild, so
  # the artifact has one current row and one history row, and 931 of the superseded rows are the
  # session-dated warm-up relabelling of §92.7, unchanged). No archive byte, byte count or digest
  # changed. Gate W0.5-5 and Gate 2D-6 verify the current and superseded rows.
  # Re-pinned 2026-11-19 under Audit §95.10 items 1-3 / criteria 1.1.16: five statutory circular
  # payloads, five statutory/levy sources, eight 2022-2023 corporate-action payloads and the rebuilt
  # point-in-time corpus are current rows. Superseded rows are history and are never edited (§10.1).
  # Re-sealed 2026-11-19 under Audit §97 item 2 (N-187): the builder now fails on the class it documents
  # as fatal, so the 2018-2023 corpus was rebuilt with 0 ex-date mismatches (was 6). Its current row was
  # superseded and one new row appended: MAN-FPR-V1 now covers 1,876,489 bytes / 1,970 rows (1,009
  # current + 961 superseded). No numeric threshold moved, no archive byte changed, and `criteria_version`
  # is held at 1.1.16 deliberately — the seq-10 registry row is append-only and declares 1.1.16, so a
  # version bump here would make its own certificate refuse the row it was registered under.
  # Re-sealed 2026-11-19 under Audit §97.10 items 1-2 (N-191, N-192): the ±35% reconciliation now computes
  # returns only between consecutive calendar sessions and exonerates a move only on a price-side record,
  # so the corpus header republishes its classes (832 → 774 moves: 1 applied, 0 archive, 699 ratio-shaped,
  # 74 not ratio-shaped, 0 ex-date mismatch) with prices, bars, sessions and content_fingerprint unchanged.
  # Its current row was superseded and one new row appended: MAN-FPR-V1 now covers 1,877,557 bytes / 1,971
  # rows (1,009 current + 962 superseded). No numeric threshold moved, no archive byte changed, and
  # `criteria_version` stays 1.1.16 for the reason above.
  expected_manifest_fingerprint: "MAN-FPR-V1-be45b7e791d5d3cd683ee119ae4beeae8cba3aab7728ac194d6b19521a691045"

  # Finding N-128 (Audit §72.3, §72.5 item 3): the trial-registry manifest witnesses
  # {evaluation_count, head_eval_hash} outside the (sidecar, anchor) pair. Pinning its SHA-256 here
  # gives that witness a root no append path writes: removing the witness keys, editing a witnessed
  # value, or appending a trial without re-pinning this anchor fails G2A-6.8. Hash of
  # data/trials/trial_registry.jsonl.manifest with LF line endings (323 bytes after the §75.10
  # append of seq 9, TRIAL-PHASE3B2-RANKED-009, which takes the registry to N = 9, N_eval = 5;
