  # N-52: Calendar sessions 2018-04-01..2021-12-31 (warm-up window) are present as FULL session records
  # but are not individually substantiated by per-session circular documents.
  # NSE annual holiday circulars for 2018–2021 are not in local Bronze storage.
  # Sessions in this range pass date-arithmetic checks but their individual holiday/trading-day
  # classifications carry no document proof beyond the annual aggregate counts.
  # Per AGENTS.md §10.8, the binding evaluation window starts 2022-01-03; warm-up sessions are
  # used only for feature warm-up and are explicitly NOT RUN for gating purposes.
  # Audit §92.7 Ruling 1 / criteria 1.1.14: the second sentence of this note was true while the binding
  # start was 2022-01-03 and is not true of 1.1.13 onward — the window is binding-eligible on A1 (5/5
  # sourced annual circulars), A2 (931/931 interval coverage) and A4 (4,357 traced ex-dates). What N-52
  # still names stands: no per-session circular substantiates these dates individually.
  pre_binding_calendar_provenance_note: "N-52: 931 sessions (2018-04-01..2021-12-31) cite no per-session NSE circular document; their classification rests on the annual 2018-2021 circulars recorded in calendar_provenance_bundle.json. Since criteria 1.1.13 these sessions are binding-eligible (Audit §91.8 Ruling 1), so a metric computed on them is NOT automatically NOT RUN; it is gated by whatever evidence that metric needs."
