  # Re-sealed 2026-11-19 under the §98.10 carried work: seq 11 (TRIAL-PHASE3B2-LIQUIDITY-ATR-011)
  # is the 11th row and its outcome is the 6th evaluation, so the manifest witnesses total_trials 11
