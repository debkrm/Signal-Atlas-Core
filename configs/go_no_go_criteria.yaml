# Signal Atlas Core — Quantitative Research Go/No-Go Decision Criteria
# Authoritative threshold configuration committed per AGENTS.md Rule 9.2.
# All verdicts (PASS/FAIL/GO/NO-GO) must be computed programmatically against these thresholds.
# Never modify thresholds post-hoc after inspecting backtest results.

metadata:
  version: "1.1.0"
  effective_date: "2026-11-11"
  market: "NSE_CASH_EQUITY"
  currency: "INR"

anti_overfitting_and_significance:
  # Minimum Deflated Sharpe Ratio (DSR) to reject false discovery across N trials (Bailey & Lopez de Prado)
  min_deflated_sharpe_ratio: "0.95"
  # Minimum Haircut Sharpe Ratio net of statutory costs and trial count haircut
  min_haircut_sharpe_ratio: "1.25"
  # Deflated Sharpe Ratio trial count N convention: total trials attempted across search space (A-11 pinned)
  dsr_trial_count_basis: "TOTAL_ATTEMPTED_TRIALS"
  # Sharpe ratio sample variance divisor convention: evaluated trials minus one (N_eval - 1)
  dsr_sharpe_variance_divisor: "EVALUATED_TRIALS_MINUS_ONE"
  # Number of trading sessions per year for Sharpe annualization (NSE cash market convention)
  sessions_per_year: 250
  # Kurtosis calculation convention: RAW_NORMAL_THREE (standard normal kurtosis = 3.0)
  kurtosis_convention: "RAW_NORMAL_THREE"
  # Haircut Sharpe ratio adjustment methodology: BONFERRONI (Harvey & Liu family-wise error rate)
  haircut_variant: "BONFERRONI"
  # Minimum number of out-of-sample trades across evaluation sample
  min_total_trades: 100
  # Maximum allowable annual portfolio turnover
  max_annual_turnover: "12.0"
  # Walk-forward parameter stability: Minimum proportion of walk-forward test folds with positive Sharpe
  min_positive_walk_forward_fold_ratio: "0.80"

risk_and_drawdown_limits:
  # Maximum portfolio drawdown allowable on closed + open positions
  max_portfolio_drawdown: "0.25"
  # Maximum drawdown duration in trading sessions
  max_drawdown_duration_sessions: 125
  # Minimum win/loss ratio (gross profit / gross loss)
  min_profit_factor: "1.50"
  # Maximum single-stock capital allocation at trade entry
  max_single_position_weight: "0.10"

execution_and_liquidity_realism:
  # Maximum volume participation per session (fraction of actual TOTTRDQTY)
  max_volume_participation_cap: "0.03"
  # Minimum Average Daily Traded Value (Turnover) required for instrument eligibility (₹ in Crore)
  min_daily_turnover_crore: "5.0"
  # Circuit filter fill restriction: Prohibit BUY at Upper Circuit (ask depth = 0)
  prohibit_buy_at_upper_circuit: true
  # Circuit filter fill restriction: Prohibit SELL / Stop-Loss fill at Lower Circuit (bid depth = 0)
  prohibit_sell_at_lower_circuit: true
  # Execution latency: Earliest execution fill session relative to signal calculation session T
  min_execution_latency_sessions: 1

statutory_indian_cost_schedule:
  # Statutory tax rates (Finance Act / Indian Stamp Act)
  stt_delivery_rate: "0.0010"              # 0.1% on delivery (both buy and sell)
  stt_intraday_sell_rate: "0.00025"        # 0.025% on intraday equity sell
  sebi_turnover_charge_rate: "0.000001"    # ₹10 per crore (0.0001%)
  stamp_duty_delivery_buy_rate: "0.00015"  # 0.015% on delivery buy
  stamp_duty_intraday_buy_rate: "0.00003"  # 0.003% on intraday buy
  gst_rate: "0.18"                         # 18% applied to taxable financial services
  brokerage_per_order_inr: "20.00"         # Default flat brokerage per executed order
  # GST taxable services base explicitly includes IPFT alongside brokerage, exchange, and SEBI charges
  gst_taxable_base_components:
    - "brokerage"
    - "exchange_turnover"
    - "sebi_turnover"
    - "ipft"

  # Effective-dated historical fee schedule for NSE cash equity segment
  effective_dated_exchange_fees:
    - circular_ref: "NSE/FA/46730"
      from_date: "2021-01-01"
      to_date: "2023-03-31"
      exchange_turnover_rate: "0.0000345"  # Slab 1 rate (₹345 per crore)
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      description: "Pre-April 2023 turnover slabs + baseline IPFT"

    - circular_ref: "NSE/FA/56129"
      from_date: "2023-04-01"
      to_date: "2024-03-31"
      exchange_turnover_rate: "0.0000325"  # 6% rollback rate (₹325 per crore)
      ipft_rate: "0.000001"                # ₹10 per crore (NSE/FA/56129)
      description: "6% rollback turnover rate + revised ₹10/cr IPFT"

    - circular_ref: "NSE/FA/61137"
      from_date: "2024-04-01"
      to_date: "2024-09-30"
      exchange_turnover_rate: "0.0000322"  # ~1% reduction rate (₹322 per crore)
      ipft_rate: "0.000001"                # ₹10 per crore
      description: "Revised turnover rate + ₹10/cr IPFT"

    - circular_ref: "NSE/FA/64323"
      from_date: "2024-10-01"
      to_date: "2026-02-28"
      exchange_turnover_rate: "0.0000297"  # SEBI uniform rate (₹297 per crore, SEBI/HO/MRD/TPD-1/P/CIR/2024/92)
      ipft_rate: "0.000001"                # ₹10 per crore
      description: "SEBI True-to-Label uniform flat rate (no slabs) + ₹10/cr IPFT"

    - circular_ref: "NSE/FA/73061"
      from_date: "2026-03-01"
      to_date: null                        # Open-ended current schedule
      exchange_turnover_rate: "0.000030699" # ₹306.99 per crore
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      description: "Revised exchange rate (₹306.99/cr) + ₹0.01/cr IPFT"

market_data_and_accounting_invariants:
  # Strict Decimal representation: Binary floating point prohibited in accounting
  # Minimum binding evaluation start date for research gating (Rule 10.8, Audit §40.5, Finding N-32)
  # Pre-2022 historical archives are unverified/absent from local storage and not bridged
  min_binding_evaluation_start_date: "2022-01-03"
  # Minimum required point-in-time symbol->ISIN resolution for actively traded EQ scrips per session (Finding H-54, Audit §41.3)
  # Audit measurement: 2,390,165 / 2,390,165 traded EQ rows across all 1,195 daily Bhavcopy sessions resolve 100.0000% with 0 failures
  min_traded_eq_resolution_pct: "100.0"
  strict_decimal_accounting_required: true
  # Fail closed on unexplained gaps in price series
  fail_closed_on_unexplained_gaps: true
  # Point-in-time universe schedule required (zero survivorship bias)
  point_in_time_universe_required: true
  # Zero forward-filling or linear interpolation of missing OHLC records
  zero_data_fabrication_required: true

  # Authoritative Calendar and Session Reconciliation Invariants (AGENTS.md §6.3, §9.2, Findings H-56, H-61, H-62, H-64)
  # H-64: Calendar identity anchor — computed from session_records (dates, session_types, open/close times) at load time
  # and compared against this human-authored string. A date swap that preserves counting passes H-61 but fails H-64.
  # This string is the ONLY copy that is not derived from the calendar file itself.
  expected_calendar_fingerprint: "CAL-FPR-V1-af8e309a6f897a670725a342aa821ec4134c5d40e56e7c3c7b1043549abfe5ad"
  # R-4: Calendar identity anchor scoped strictly to the 1,196 sourced sessions in binding window 2022-01-03..2026-10-31
  expected_sourced_window_calendar_fingerprint: "CAL-FPR-V1-2d5ac7ac32455327cd636d64a4e15a1f689f25eb42a815e151ea31c3cf61cda1"
  # Pinned uncurated baseline schedule sessions in evaluation window 2022-01-03..2026-10-31
  expected_baseline_calendar_sessions: 1201
  # Pinned authoritative exchange trading sessions held in evaluation window 2022-01-03..2026-10-31
  expected_authoritative_calendar_sessions: 1196
  # Pinned total authoritative trading sessions across full calendar 2015-01-01..2026-11-11
  expected_total_calendar_sessions: 2935
  # Strict enumeration of authorized unarchived special session data gaps (Finding H-62)
  # Unarchived session gaps are strictly capped and cannot be extended without human criteria commit
  authorized_unarchived_special_sessions:
    - "2025-02-01"
  # Strict enumeration of authorized baseline calendar holiday exclusions (Finding H-61)
  authorized_calendar_holiday_exclusions:
    - "2025-10-22"
    - "2026-01-15"
    - "2026-03-26"
    - "2026-03-31"
    - "2026-05-28"
    - "2026-06-26"
    - "2026-09-14"
  # Strict enumeration of authorized baseline calendar trading session inclusions (Finding H-61)
  authorized_calendar_trading_inclusions:
    - "2026-03-20"
    - "2026-05-27"

  # N-52: Calendar sessions 2018-04-01..2021-12-31 (warm-up window) are present as FULL session records
  # but are not individually substantiated by per-session circular documents.
  # NSE annual holiday circulars for 2018–2021 are not in local Bronze storage.
  # Sessions in this range pass date-arithmetic checks but their individual holiday/trading-day
  # classifications carry no document proof beyond the annual aggregate counts.
  # Per AGENTS.md §10.8, the binding evaluation window starts 2022-01-03; warm-up sessions are
  # used only for feature warm-up and are explicitly NOT RUN for gating purposes.
  pre_binding_calendar_provenance_note: "N-52: 930 binding-range warm-up sessions (2018-04-01..2021-12-31) cite no per-session NSE circular document. Sessions in this range are warm-up only; metrics computed on them are NOT RUN for gating per AGENTS.md §10.8."
