# Signal Atlas Core — Quantitative Research Go/No-Go Decision Criteria
# Authoritative threshold configuration committed per AGENTS.md Rule 9.2.
# All verdicts (PASS/FAIL/GO/NO-GO) must be computed programmatically against these thresholds.
# Never modify thresholds post-hoc after inspecting backtest results.

metadata:
  # 1.1.7 (2026-11-17): no existing numeric threshold changed; three new bindings, each pre-registered
  # here before any run that could be judged by it (Audit §77.12 items 4-6, §77.13, §77.15 items 2/6):
  #   `min_liquidated_pf_ex_top_1: 1.40` — CRIT-OVERFIT-05. A liquidated PF that needs its single
  #           largest winner to clear 1.50 has no margin; seq 9 measures 1.6440 liquidated against
  #           1.4812 without that trade, so the margin is now its own binding row instead of a
  #           sentence in the report. The prefix `liquidated_` is load-bearing: the threshold is
  #           read against `liquidated_pf_ex_top_1`, never the closed-book PF.
  #   `min_positive_is_fold_ratio: 0.75` and `min_fold_liquidated_pf: 1.30` — CRIT-OVERFIT-03 is
  #           re-pointed at the anchored expanding in-sample folds (ends 2022-06-30, 2022-12-30,
  #           2023-06-30, 2023-12-29) computed from one run's own trade ledger, partitioned by exit
  #           date. At least 3 of 4 must show positive closed-book net expectancy AND liquidated PF
  #           >= 1.30. No re-fit and no re-run, so the four partitions are one trial (§8.2), and the
  #           2024 validation fold is neither spent nor required. The previous definition (>= 2
  #           out-of-sample validation folds, `min_positive_walk_forward_fold_ratio: 0.80`) is not
  #           withdrawn: it moves unchanged to CRIT-OVERFIT-06, which stays NOT RUN until a second
  #           validation fold exists.
  # 1.1.6 (2026-11-17): no numeric threshold changed. Audit §76.16 items 1-6 are definition changes,
  # each committed here with a restatement note naming what moved:
  #   N-139 — `expected_trial_registry_manifest_sha256` is excluded from `criteria_fingerprint`
  #           (an append moves it by construction, so the anchor no longer describes a pin that only
  #           existed before the run). The pin stays mandatory in the loader and is still enforced by
  #           Gate G2A-6.8a.
  #   N-141 — `min_haircut_sharpe_ratio` is now gated as `CRIT-OVERFIT-04` instead of sitting in
  #           this file unenforced.
  #   Ruling 1 — `CRIT-STAT-01` (>= 100) and `CRIT-STAT-02` (PF >= 1.50) are evaluated on the
  #           liquidated book; the closed-only pair is retained as disclosure on the same row.
  #   Ruling 2 — `CRIT-STAT-03` (<= 0.10) is evaluated at trade entry, as its own comment says; the
  #           hold-period maximum is a non-gating disclosure.
  #   Ruling 3 / N-140 — `min_traded_eq_resolution_pct` is wired to the H-54 traded-row measure, and
  #           dataset completeness gets its own binding threshold,
  #           `min_dataset_instrument_resolution_pct: 100.0`.
  # 1.1.5 (2026-11-17): no threshold changed. Version bumped because Audit §75.10 items 3 and 4 add
  # three pre-registered inputs, all of them criteria fields so they sit inside the fingerprint a
  # verdict cites: `entry_rank_indicator` (the cross-sectional entry rank seq 9 tests), and
  # `min_entry_notional` / `min_fill_notional` (the viability floors that stop a ₹20 fixed brokerage
  # consuming 12-82% of a micro-order). 1.1.5 re-pins the trials manifest after seq 9 appends.
  # 1.1.4 pre-registered `unbanded_session_fill_policy: LOCKED_BAR_REFUSAL_ONLY` before seq 8 and
  # re-pinned the manifest at seq 8 (N = 8, N_eval = 4).
  # 1.1.3 re-pinned the trials manifest after Audit §73.9 items 3 and 4 appended seq 6/7 (N = 7,
  # N_eval = 3); 1.1.2 added that pin (Audit §72 N-128); 1.1.1 recorded the pin move that followed
  # the corporate_actions.jsonl restatement (Audit §68.6 item 3, H-115, N-112).
  # 1.1.8 (2026-11-17): no numeric threshold and no criterion changed. Three repairs close bypass gaps
  # the §78 audit measured, and the manifest pin is resealed because the corpus grew:
  #   N-148 — `CRIT-STAT-01` is NOT RUN when `total_trades` arrives without the liquidated positions
  #           or the declared liquidated count, so a bundle can no longer pass on the key's name by
  #           omitting the evidence the reconciliation reads (§14.4, §78.8).
  #   N-149 — `CRIT-OVERFIT-03` requires all four pre-registered anchored fold ends and refuses a
  #           self-declared ratio that carries no fold rows (§78.9).
  #   N-150 — `CRIT-OVERFIT-06` is NOT RUN below 2 validation folds, whatever ratio is supplied (§78.10).
  #   N-151 — `ISIN_TRANSITION` rows are generated for every multi-ISIN symbol in the committed
  #           interval table, so the expected_manifest_fingerprint pin is recomputed (§78.11).
  # 1.1.9 (2026-11-17): no numeric threshold and no criterion changed. Audit §79.12 items 2, 4 and 5
  # close three bypasses the §79 round measured, and the manifest pin is resealed because TATASTEEL's
  # documented transition moved one session to meet the interval boundary:
  #   N-156 — `CRIT-OVERFIT-06` is NOT RUN when a positive fold ratio arrives without a valid integer
  #           `walk_forward_validation_folds_count`, so the two-fold minimum cannot be skipped by
  #           omitting the count that triggers it (§79.4, §14.4).
  #   N-159 — `CRIT-STAT-01` is NOT RUN when `total_trades` and `liquidated_open_positions` arrive
  #           without `closed_only_trade_count`: an empty positions list is an affirmative statement
  #           only when there is a closed count to reconcile the sum against (§79.2).
  #   N-158 — `corporate_actions.jsonl` dates TATASTEEL's ISIN transition 2022-07-29 (the successor
  #           ISIN's first session) instead of 2022-07-28, and the generator now asserts that every
  #           documented pair meets its interval boundary instead of skipping it silently (§79.5).
  # 1.1.10 (2026-11-18): no numeric threshold and no criterion changed. Audit §86.5 Ruling 1 corrects the
  # 2019 calendar grid: Tuesday 2019-10-29 is a regular session the grid omitted, and the committed
  # NSE/CMTR/39612 annual holiday list declares no holiday on that date. `expected_total_calendar_sessions`
  # therefore moves 2935 -> 2936, 2019 moves 244 -> 245, the warm-up window 2018-04-01..2021-12-31 moves
  # 930 -> 931, `expected_calendar_fingerprint` is resealed to the recomputed CAL-FPR, and the manifest pin
  # is resealed because seven 2018-2021 A1 circular artifacts are registered (§86.6 items 1-3, 9). Every
  # gating window, count, tolerance, weight and criterion is otherwise byte-identical to 1.1.9; the
  # corrected date is pre-binding (warm-up only, §10.8), so no verdict computed on the binding window moves.
  # 1.1.12 (2026-11-18): no existing numeric threshold and no criterion changed; ONE new binding is
  # pre-registered here, before any run that could use it. Audit §90.7 Ruling 2 / §90.9 item 1 appends
  # 7,989 series-restatement rows to cash_equity_symbol_intervals.csv (each supersedes a row it names
  # and no row is edited or deleted), so the EQ-only entry gate (Gate G2C-3) and the point-in-time EQ
  # universe stop answering `EQ` for 1,206 of 1,336 trade-to-trade ISIN-sessions — the measurement is
  # `probe_n175`, which reads 0 of 1,336. §90.9 item 2 captures 15 Bronze payloads for
  # 2018-04-01..2021-12-31 and the generator merges their 4,495 dividend rows, so `A4 dividends` prints
  # PASS over the warm-up window. §90.9 item 3 extends the interval log back to 2018-04-02 (6,784
  # appended rows, all 931 warm-up sessions covered) and measures 102 new identity boundaries, 324 ->
  # 426, each dated at its successor ISIN's first session; 426 is the count `probe_n158` now asserts
  # under §90.6 Ruling 1, with the 324 post-2022 tuples asserted to survive. §90.9 item 4 declares
  # `max_hold_trading_sessions: 21` below: a NEW binding, pre-registered, enforcing AGENTS.md §13.2
  # against a held position crossing an unadjusted ex-date. `expected_manifest_fingerprint` is resealed
  # over the grown manifest. `min_binding_evaluation_start_date` stays 2022-01-03 and
  # `expected_calendar_fingerprint` stays CAL-FPR-V1-6acb5f45…; every fold, trial count and existing
  # threshold is unchanged. §89.5 Ruling 1's A5 residual is recorded here, not cleared: gating still
  # begins 2022-01-03, so the warm-up sessions this version now describes remain WARMUP_NOT_GATABLE and
  # every pre-2022 verdict stays NOT RUN (§10.8).
  # 1.1.11 (2026-11-18): no numeric threshold and no criterion changed. Audit §87.5 Ruling 1 authorises Bronze
  # capture of the 931 warm-up sessions 2018-04-01..2021-12-31, and that capture registers one current
  # manifest row per archive (931 rows, carrying source_url, retrieved_at, byte_count, sha256, session_type
  # and the WARMUP_NOT_GATABLE label), so `expected_manifest_fingerprint` is resealed over the grown manifest.
  # `min_binding_evaluation_start_date` stays 2022-01-03, `expected_calendar_fingerprint` stays
  # CAL-FPR-V1-6acb5f45..., `expected_sourced_window_calendar_fingerprint` stays, every count, tolerance,
  # weight, cost parameter and criterion is byte-identical to 1.1.10, and capture eligibility grants no
  # gating eligibility: no verdict, metric or trial may be computed over a WARMUP_NOT_GATABLE session.
  # 1.1.13 (2026-11-18): no numeric threshold and no criterion changed. Audit §91.8 Ruling 1 promotes
  # the 931 captured sessions 2018-04-01..2021-12-31 from WARMUP_NOT_GATABLE to gating-eligible on a
  # sourced calendar (A1 5/5), a corrected identity log (A2 931/931, 426 dated pairs) and 4,357 traced
  # ex-dates (A4), so `min_binding_evaluation_start_date` moves 2022-01-03 -> 2018-04-01. That is the
  # only value moved: `expected_sourced_window_calendar_fingerprint`, `expected_baseline_calendar_sessions`
  # (1,201), `expected_authoritative_calendar_sessions` (1,196), `expected_calendar_fingerprint`, every
  # fold, trial count, cost parameter and threshold is byte-identical to 1.1.12. `storage/gating.py`'s
  # BINDING_EVALUATION_START_DATE and this value are two sources for one fact and move together. The
  # promotion authorises no verdict: CRIT-B6 stays NOT RUN (3 surveillance rows in the corpus),
  # CRIT-OVERFIT-06 stays NOT RUN below two validation folds (N-150), and the hold-bound criterion
  # remains NOT RUN until the bound has a consumer. The 931 manifest rows still read WARMUP_NOT_GATABLE
  # as captured; relabelling them by append and re-pinning MAN-FPR is the remaining promotion mechanic.
  # 1.1.14 (2026-11-18): no numeric threshold and no criterion changed. Audit §92.7 Ruling 1 aligns the
  # capture label with the binding start 1.1.13 committed: the 931 `data/reference/manifest.jsonl` rows
  # for 2018-04-01..2021-12-31 are superseded by append (each prior row flips to `is_current: false` /
  # `status: superseded` and keeps its digest; each appended row keeps the identical `byte_count`,
  # `sha256`, `source_url`, `retrieved_at` and `session_type`) with `gating_mode: BINDING_EVALUATION`,
  # and `scripts/probe_pre2022_bronze_coverage.py` derives the expected label from
  # `min_binding_evaluation_start_date` instead of hard-coding `WARMUP_NOT_GATABLE`, so a tree whose
  # criteria and labels disagree fails closed. "expected_manifest_fingerprint" is re-pinned over the grown
  # manifest by measurement. `min_binding_evaluation_start_date` stays 2018-04-01, "expected_calendar_fingerprint"
  # stays CAL-FPR-V1-6acb5f45…, "expected_sourced_window_calendar_fingerprint" stays 2d5ac7ac…, and every
  # count, tolerance, weight, fold, trial count and criterion is byte-identical to 1.1.13. A relabel
  # asserts nothing new about prices: it states the maturity of an input A1, A2 and A4 already certified.
  version: "1.1.14"
  effective_date: "2026-11-18"
  market: "NSE_CASH_EQUITY"
  currency: "INR"

anti_overfitting_and_significance:
  # Minimum Deflated Sharpe Ratio (DSR) to reject false discovery across N trials (Bailey & Lopez de Prado)
  min_deflated_sharpe_ratio: "0.95"
  # Minimum Haircut Sharpe Ratio net of statutory costs and trial count haircut
  min_haircut_sharpe_ratio: "1.25"
  # Deflated Sharpe Ratio trial count N convention: total trials attempted across search space (A-11 pinned)
  dsr_trial_count_basis: "TOTAL_ATTEMPTED_TRIALS"
  # Sharpe ratio sample variance divisor convention: evaluated trials minus one (N_eval - 1)
  dsr_sharpe_variance_divisor: "EVALUATED_TRIALS_MINUS_ONE"
  # Number of trading sessions per year for Sharpe annualization (NSE cash market convention)
  sessions_per_year: 250
  # Kurtosis calculation convention: RAW_NORMAL_THREE (standard normal kurtosis = 3.0)
  kurtosis_convention: "RAW_NORMAL_THREE"
  # Haircut Sharpe ratio adjustment methodology: BONFERRONI (Harvey & Liu family-wise error rate)
  haircut_variant: "BONFERRONI"
  # Minimum number of out-of-sample trades across evaluation sample
  min_total_trades: 100
  # Maximum allowable annual portfolio turnover
  max_annual_turnover: "12.0"
  # Walk-forward parameter stability: Minimum proportion of walk-forward test folds with positive Sharpe
  min_positive_walk_forward_fold_ratio: "0.80"
  # Audit §77.13 (1.1.7): in-sample stability from the run's own ledger — at least 3 of the 4 anchored
  # expanding folds must be positive, and each counted fold's liquidated PF must clear this floor.
  min_positive_is_fold_ratio: "0.75"
  min_fold_liquidated_pf: "1.30"

risk_and_drawdown_limits:
  # Maximum portfolio drawdown allowable on closed + open positions
  max_portfolio_drawdown: "0.25"
  # Maximum drawdown duration in trading sessions
  max_drawdown_duration_sessions: 125
  # Minimum win/loss ratio (gross profit / gross loss)
  min_profit_factor: "1.50"
  # Audit §77.12 item 4 (1.1.7): the same ratio with its single largest winner removed
  min_liquidated_pf_ex_top_1: "1.40"
  # Maximum single-stock capital allocation at trade entry
  max_single_position_weight: "0.10"

execution_and_liquidity_realism:
  # Maximum volume participation per session (fraction of actual TOTTRDQTY)
  max_volume_participation_cap: "0.03"
  # Minimum Average Daily Traded Value (Turnover) required for instrument eligibility (₹ in Crore)
  min_daily_turnover_crore: "5.0"
  # Circuit filter fill restriction: Prohibit BUY at Upper Circuit (ask depth = 0)
  prohibit_buy_at_upper_circuit: true
  # Circuit filter fill restriction: Prohibit SELL / Stop-Loss fill at Lower Circuit (bid depth = 0)
  prohibit_sell_at_lower_circuit: true
  # Execution latency: Earliest execution fill session relative to signal calculation session T
  min_execution_latency_sessions: 1
  # Maximum holding period, in authoritative NSE calendar sessions counted from the entry session
  # (Audit §90.9 item 4, AGENTS.md §13.2). A delivery position may not be carried past this many
  # sessions, so no held position crosses an unadjusted corporate-action ex-date without the action
  # being applied to it. `Position.require_within_hold_bound` refuses the hold; a hold that cannot
  # exit inside the bound because the bid is locked at the lower circuit is a refusal, never a silent
  # extension (§5.3). Declared before any run and used only on the training/validation windows.
  max_hold_trading_sessions: 21
  # Audit §74.10 Ruling D — the unbanded-session fill policy in force, pre-registered before seq 8.
  # NSE publishes the band *code* in a single rolling sec_list.csv that is overwritten in place, and
  # the bhavcopy carries no band column, so no daily 2022-2023 band history exists to source: H-83 as
  # written admits 3 of 179 instruments and returns a criterion that has never been computed.
  # LOCKED_BAR_REFUSAL_ONLY therefore narrows the requirement, not the window: an instrument-session
  # with no attested band fills at the usual T+1 open plus the existing slippage and statutory-cost
  # model, UNLESS the session bar is locked (high == low, zero depth on one side), which is refused on
  # both sides (§5.3). No band and no circuit limit is ever synthesized from a price, and
  # CRIT-EXEC-03/CRIT-EXEC-04 remain NOT RUN over unsourced sessions — the policy does not claim to
  # know whether a non-locked open sat at a limit. This is an assumption about fills, not a threshold:
  # setting STRICT_BAND_REQUIRED restores H-83 exactly (no band, no entry and no exit).
  unbanded_session_fill_policy: "LOCKED_BAR_REFUSAL_ONLY"

  # Audit §75.10 N-137 — the entry selection rule, pre-registered before seq 9. `NONE` is the
  # alphabetical-ISIN order every prior trial used; `mom_63` ranks the session's qualifying entries by
  # 63-session trailing close return, descending, with an ascending `isin` tie-break, so the capital
  # slots go to the strongest names instead of the lexicographically first ones. This is not a
  # threshold: it changes which signal gets a slot, and it is recorded in `canonical_params`.
  entry_rank_indicator: "mom_63"

  # Audit §75.10 N-138 — minimum economically viable order sizes (₹). An entry whose notional is below
  # `min_entry_notional` is a named no-trade instead of a booked micro-position, and a BUY fill that
  # lands below `min_fill_notional` is refused rather than booked. At ₹20 per order, statutory cost on
  # the sub-₹5,000 decile measured 12-82% of notional (§75.8). Exits are never refused by this floor:
  # a frozen exit is an unbounded hold (§5.3, §13.2).
  min_entry_notional: "25000"
  min_fill_notional: "5000"

statutory_indian_cost_schedule:
  # Statutory tax rates (Finance Act / Indian Stamp Act)
  stt_delivery_rate: "0.0010"              # 0.1% on delivery (both buy and sell)
  stt_intraday_sell_rate: "0.00025"        # 0.025% on intraday equity sell
  sebi_turnover_charge_rate: "0.000001"    # ₹10 per crore (0.0001%)
  stamp_duty_delivery_buy_rate: "0.00015"  # 0.015% on delivery buy
  stamp_duty_intraday_buy_rate: "0.00003"  # 0.003% on intraday buy
  gst_rate: "0.18"                         # 18% applied to taxable financial services
  brokerage_per_order_inr: "20.00"         # Default flat brokerage per executed order
  # GST taxable services base explicitly includes IPFT alongside brokerage, exchange, and SEBI charges
  gst_taxable_base_components:
    - "brokerage"
    - "exchange_turnover"
    - "sebi_turnover"
    - "ipft"

  # Effective-dated historical fee schedule for NSE cash equity segment
  effective_dated_exchange_fees:
    - circular_ref: "NSE/FA/46730"
      from_date: "2021-01-01"
      to_date: "2023-03-31"
      exchange_turnover_rate: "0.0000345"  # Slab 1 rate (₹345 per crore)
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      description: "Pre-April 2023 turnover slabs + baseline IPFT"

    - circular_ref: "NSE/FA/56129"
      from_date: "2023-04-01"
      to_date: "2024-03-31"
      exchange_turnover_rate: "0.0000325"  # 6% rollback rate (₹325 per crore)
      ipft_rate: "0.000001"                # ₹10 per crore (NSE/FA/56129)
      description: "6% rollback turnover rate + revised ₹10/cr IPFT"

    - circular_ref: "NSE/FA/61137"
      from_date: "2024-04-01"
      to_date: "2024-09-30"
      exchange_turnover_rate: "0.0000322"  # ~1% reduction rate (₹322 per crore)
      ipft_rate: "0.000001"                # ₹10 per crore
      description: "Revised turnover rate + ₹10/cr IPFT"

    - circular_ref: "NSE/FA/64323"
      from_date: "2024-10-01"
      to_date: "2026-02-28"
      exchange_turnover_rate: "0.0000297"  # SEBI uniform rate (₹297 per crore, SEBI/HO/MRD/TPD-1/P/CIR/2024/92)
      ipft_rate: "0.000001"                # ₹10 per crore
      description: "SEBI True-to-Label uniform flat rate (no slabs) + ₹10/cr IPFT"

    - circular_ref: "NSE/FA/73061"
      from_date: "2026-03-01"
      to_date: null                        # Open-ended current schedule
      exchange_turnover_rate: "0.000030699" # ₹306.99 per crore
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      description: "Revised exchange rate (₹306.99/cr) + ₹0.01/cr IPFT"

market_data_and_accounting_invariants:
  # Strict Decimal representation: Binary floating point prohibited in accounting
  # Minimum binding evaluation start date for research gating (Rule 10.8, Audit §40.5, Finding N-32)
  # Pre-2022 historical archives are unverified/absent from local storage and not bridged
  min_binding_evaluation_start_date: "2018-04-01"
  # Minimum required point-in-time symbol->ISIN resolution for actively traded EQ scrips per session (Finding H-54, Audit §41.3)
  # Audit measurement: 2,390,165 / 2,390,165 traded EQ rows across all 1,195 daily Bhavcopy sessions resolve 100.0000% with 0 failures
  min_traded_eq_resolution_pct: "100.0"
  # Audit §76.9 N-140 / Ruling 3: dataset completeness is a different quantity from row resolution —
  # the share of the research dataset's *instruments* that resolved to an authoritative ISIN at all.
  # Measured 196 / 211 = 92.8910% on EXP-DEV-2022-2024-V2, so this fails closed until the 15
  # unresolved instruments are named and accounted for. Wiring it here keeps the row measure and the
  # completeness measure from impersonating each other (§9.1).
  min_dataset_instrument_resolution_pct: "100.0"
  strict_decimal_accounting_required: true
  # Fail closed on unexplained gaps in price series
  fail_closed_on_unexplained_gaps: true
  # Point-in-time universe schedule required (zero survivorship bias)
  point_in_time_universe_required: true
  # Zero forward-filling or linear interpolation of missing OHLC records
  zero_data_fabrication_required: true

  # Finding H-72: Authoritative reference manifest fingerprint pinned as criteria anchor (Audit §54.5, §54.10, §60.6 Item 4, §62.6 Item 4)
  # MAN-FPR-V1 covers data/reference/manifest.jsonl content (1,865,503 bytes, SHA-256
  # a421d3d2de37ada0cf03c536782c64ffb305627ebef7baca15fdd8bfc59646b6); re-pinned 2026-11-18 under
  # Audit §92.7 Ruling 1 / criteria 1.1.14, which superseded the 931 warm-up Bhavcopy rows by append so
  # their `gating_mode` reads BINDING_EVALUATION (931 appended rows; the 931 prior rows flip to
  # is_current: false and are retained as history). No archive byte, byte count or digest changed.
  # 1,000 current rows and 957 superseded rows are verified by Gate W0.5-5 and Gate 2D-6.
  expected_manifest_fingerprint: "MAN-FPR-V1-a421d3d2de37ada0cf03c536782c64ffb305627ebef7baca15fdd8bfc59646b6"

  # Finding N-128 (Audit §72.3, §72.5 item 3): the trial-registry manifest witnesses
  # {evaluation_count, head_eval_hash} outside the (sidecar, anchor) pair. Pinning its SHA-256 here
  # gives that witness a root no append path writes: removing the witness keys, editing a witnessed
  # value, or appending a trial without re-pinning this anchor fails G2A-6.8. Hash of
  # data/trials/trial_registry.jsonl.manifest with LF line endings (323 bytes after the §75.10
  # append of seq 9, TRIAL-PHASE3B2-RANKED-009, which takes the registry to N = 9, N_eval = 5;
  # 324 bytes after the §74.10 append of seq 8).
  expected_trial_registry_manifest_sha256: "3326b1b221b2e02616915a9d1f56a4026affa82506803abcc783e2261bf37306"

  # Authoritative Calendar and Session Reconciliation Invariants (AGENTS.md §6.3, §9.2, Findings H-56, H-61, H-62, H-64)
  # H-64: Calendar identity anchor — computed from session_records (dates, session_types, open/close times) at load time
  # and compared against this human-authored string. A date swap that preserves counting passes H-61 but fails H-64.
  # This string is the ONLY copy that is not derived from the calendar file itself.
  expected_calendar_fingerprint: "CAL-FPR-V1-6acb5f45ce5686a503a53e7fc96c12a41391d16bde5abbe2f9c91073c47a9ac9"
  # R-4: Calendar identity anchor scoped strictly to the 1,196 sourced sessions in binding window 2022-01-03..2026-10-31
  expected_sourced_window_calendar_fingerprint: "CAL-FPR-V1-2d5ac7ac32455327cd636d64a4e15a1f689f25eb42a815e151ea31c3cf61cda1"
  # Pinned uncurated baseline schedule sessions in evaluation window 2022-01-03..2026-10-31
  expected_baseline_calendar_sessions: 1201
  # Pinned authoritative exchange trading sessions held in evaluation window 2022-01-03..2026-10-31
  expected_authoritative_calendar_sessions: 1196
  # Pinned total authoritative trading sessions across full calendar 2015-01-01..2026-11-11
  expected_total_calendar_sessions: 2936
  # Strict enumeration of authorized unarchived special session data gaps (Finding H-62)
  # Unarchived session gaps are strictly capped and cannot be extended without human criteria commit
  authorized_unarchived_special_sessions:
    - "2025-02-01"
  # Strict enumeration of authorized baseline calendar holiday exclusions (Finding H-61)
  authorized_calendar_holiday_exclusions:
    - "2025-10-22"
    - "2026-01-15"
    - "2026-03-26"
    - "2026-03-31"
    - "2026-05-28"
    - "2026-06-26"
    - "2026-09-14"
  # Strict enumeration of authorized baseline calendar trading session inclusions (Finding H-61)
  authorized_calendar_trading_inclusions:
