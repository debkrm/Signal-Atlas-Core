  # appended rows, all 931 warm-up sessions covered) and measures 102 new identity boundaries, 324 ->
  # 426, each dated at its successor ISIN's first session; 426 is the count `probe_n158` now asserts
  # under §90.6 Ruling 1, with the 324 post-2022 tuples asserted to survive. §90.9 item 4 declares
  # `max_hold_trading_sessions: 21` below: a NEW binding, pre-registered, enforcing AGENTS.md §13.2
  # against a held position crossing an unadjusted ex-date. `expected_manifest_fingerprint` is resealed
  # over the grown manifest. `min_binding_evaluation_start_date` stays 2022-01-03 and
  # `expected_calendar_fingerprint` stays CAL-FPR-V1-6acb5f45…; every fold, trial count and existing
  # threshold is unchanged. §89.5 Ruling 1's A5 residual is recorded here, not cleared: gating still
  # begins 2022-01-03, so the warm-up sessions this version now describes remain WARMUP_NOT_GATABLE and
  # every pre-2022 verdict stays NOT RUN (§10.8).
  # 1.1.11 (2026-11-18): no numeric threshold and no criterion changed. Audit §87.5 Ruling 1 authorises Bronze
  # capture of the 931 warm-up sessions 2018-04-01..2021-12-31, and that capture registers one current
  # manifest row per archive (931 rows, carrying source_url, retrieved_at, byte_count, sha256, session_type
  # and the WARMUP_NOT_GATABLE label), so `expected_manifest_fingerprint` is resealed over the grown manifest.
  # `min_binding_evaluation_start_date` stays 2022-01-03, `expected_calendar_fingerprint` stays
  # CAL-FPR-V1-6acb5f45..., `expected_sourced_window_calendar_fingerprint` stays, every count, tolerance,
  # weight, cost parameter and criterion is byte-identical to 1.1.10, and capture eligibility grants no
  # gating eligibility: no verdict, metric or trial may be computed over a WARMUP_NOT_GATABLE session.
  # 1.1.13 (2026-11-18): no numeric threshold and no criterion changed. Audit §91.8 Ruling 1 promotes
  # the 931 captured sessions 2018-04-01..2021-12-31 from WARMUP_NOT_GATABLE to gating-eligible on a
  # sourced calendar (A1 5/5), a corrected identity log (A2 931/931, 426 dated pairs) and 4,357 traced
  # ex-dates (A4), so `min_binding_evaluation_start_date` moves 2022-01-03 -> 2018-04-01. That is the
  # only value moved: `expected_sourced_window_calendar_fingerprint`, `expected_baseline_calendar_sessions`
  # (1,201), `expected_authoritative_calendar_sessions` (1,196), `expected_calendar_fingerprint`, every
  # fold, trial count, cost parameter and threshold is byte-identical to 1.1.12. `storage/gating.py`'s
  # BINDING_EVALUATION_START_DATE and this value are two sources for one fact and move together. The
  # promotion authorises no verdict: CRIT-B6 stays NOT RUN (3 surveillance rows in the corpus),
  # CRIT-OVERFIT-06 stays NOT RUN below two validation folds (N-150), and the hold-bound criterion
  # remains NOT RUN until the bound has a consumer. The 931 manifest rows still read WARMUP_NOT_GATABLE
  # as captured; relabelling them by append and re-pinning MAN-FPR is the remaining promotion mechanic.
  # 1.1.14 (2026-11-18): no numeric threshold and no criterion changed. Audit §92.7 Ruling 1 aligns the
  # capture label with the binding start 1.1.13 committed: the 931 `data/reference/manifest.jsonl` rows
  # for 2018-04-01..2021-12-31 are superseded by append (each prior row flips to `is_current: false` /
  # `status: superseded` and keeps its digest; each appended row keeps the identical `byte_count`,
  # `sha256`, `source_url`, `retrieved_at` and `session_type`) with `gating_mode: BINDING_EVALUATION`,
  # and `scripts/probe_pre2022_bronze_coverage.py` derives the expected label from
  # `min_binding_evaluation_start_date` instead of hard-coding `WARMUP_NOT_GATABLE`, so a tree whose
  # criteria and labels disagree fails closed. "expected_manifest_fingerprint" is re-pinned over the grown
  # manifest by measurement. `min_binding_evaluation_start_date` stays 2018-04-01, "expected_calendar_fingerprint"
  # stays CAL-FPR-V1-6acb5f45…, "expected_sourced_window_calendar_fingerprint" stays 2d5ac7ac…, and every
  # count, tolerance, weight, fold, trial count and criterion is byte-identical to 1.1.13. A relabel
  # asserts nothing new about prices: it states the maturity of an input A1, A2 and A4 already certified.
  # 1.1.15 (2026-11-18): no numeric threshold and no criterion changed. Audit §94.6 items 1-3 are
  # executed in this version, and the two pins it moves are moved by measurement:
  #   item 1 — `data/reference/historical_dataset_2018_2023.json.gz` is registered as a current manifest
  #           row, so `expected_manifest_fingerprint` is resealed over the grown manifest. The corpus is
  #           the derived-layer SPLIT_BONUS_ADJUSTED panel for 2018-04-01..2023-12-29 (1,082 ISINs on a
  #           1,425 sessions), built from the committed Bronze archives by exact split/bonus ratios
  #           applied strictly before each ex-date; dividends stay cash inflows and no series is
  #           stitched across an ISIN transition.
  #   item 2 — the walk-forward in-sample fold is derived from the requested window instead of typed
  #           beside the loop (`FOLD-SPEC-V1-36a39987…` for 2018-04-01..2023-12-31, N-180). No fold is
  #           re-defined for any existing window: the 2022-01-03..2023-12-29 fold and the frozen 2024
  #           validation fold are byte-identical.
  #   item 3 — NOT RUN, and nothing is appended: the committed schedule's earliest exchange-fee row
  #           is 2021-01-01, so `get_exchange_fee_for_date` raises for the window's first session
  #           (2018-04-02) and the run refuses before registering (`scripts/run_seq10_candidate.py`,
  #           measured). No sourced pre-2021 turnover rate exists in the repository, and §7.2 forbids a
  #           flat or invented rate, so the expanded window is NOT RUN rather than mispriced. The
  #           registry therefore stays at N = 9 / `evaluation_count` = 5 and
  #           `expected_trial_registry_manifest_sha256` is unchanged.
  # `min_binding_evaluation_start_date` stays 2018-04-01, `expected_calendar_fingerprint` stays
  # CAL-FPR-V1-6acb5f45…, `expected_sourced_window_calendar_fingerprint` stays 2d5ac7ac…, the 1,201 and
  # 1,196 calendar pins stay, and every count, tolerance, weight, cost parameter and criterion is
  # byte-identical to 1.1.14. The new corpus changes no verdict already computed: it is an input to
  # seq 10, which is a new trial row and not a restatement of any earlier one.
  # 1.1.16 (2026-11-19): no numeric threshold and no criterion changed; no fold, calendar pin or
  # gating start moved. Audit §95.10 items 1-5 are executed and the two pins move by measurement:
  #   items 1-2 — the statutory schedule gains committed circular bytes (`data/raw/circulars/<ref>/`,
  #           one manifest per payload with source_url, retrieved_at, byte_count, sha256) and every
  #           `effective_dated_exchange_fees` row now carries `circular_sha256`. A pre-2021 row
  #           (from 2018-04-01, ₹325/cr, IPFT ₹0.01/cr) makes 2018-04-02 priced. STT, stamp duty and
  #           the SEBI turnover charge became half-open interval tables: the SEBI fee is halved for
  #           2020-06-01..2021-03-31 and stamp duty moves from the state schedules to the uniform
  #           Indian Stamp Act rates on 2020-07-01. `expected_manifest_fingerprint` is re-pinned over
  #           the manifest grown by the corpus rebuild and eight corporate-action payloads.
  #   item 2 — `universe_by_date[D]` is now the ISINs that traded on D (POINT_IN_TIME_TRADED): 2,735
  #           ISINs over the window, 1,646 on the first session, and no full-span condition. The 564
  #           day-one names §95.5.5 measured as deleted retroactively are back on the dates they traded.
  #   item 3 — the adjustment table is archive-attested: 355 rows appended with `source_digest`, 75
  #           digests backfilled onto rows already attested, 10 unattested/contradicted rows superseded
  #           by restatement (INFY's 2018-09-12 bonus and IDEA's 2023-09-15 consolidation among them).
  #   items 4-5 — `DEMERGER` exists as a type and as an exit constraint; probes N-181..N-185 are
  #           registered; `TRIAL-PHASE3B2-RANKED-009` is annotated NON_REPRODUCIBLE_AT 77fb043 without
  #           altering any historical metric. seq 10 is registered at N = 10 with evaluation_count 5,
  #           so `expected_trial_registry_manifest_sha256` is re-sealed over the appended registry.
  # `min_binding_evaluation_start_date` stays 2018-04-01, `expected_calendar_fingerprint` stays
  # CAL-FPR-V1-6acb5f45…, `expected_sourced_window_calendar_fingerprint` stays 2d5ac7ac…, the 1,201 and
  # 1,196 calendar pins stay, the 2024 validation fold stays frozen, the holdout stays sealed, and every
  # count, tolerance, weight, fold, trial count and numeric threshold is byte-identical to 1.1.15.
  version: "1.1.16"
  effective_date: "2026-11-19"
  market: "NSE_CASH_EQUITY"
  currency: "INR"

anti_overfitting_and_significance:
  # Minimum Deflated Sharpe Ratio (DSR) to reject false discovery across N trials (Bailey & Lopez de Prado)
  min_deflated_sharpe_ratio: "0.95"
  # Minimum Haircut Sharpe Ratio net of statutory costs and trial count haircut
  min_haircut_sharpe_ratio: "1.25"
  # Deflated Sharpe Ratio trial count N convention: total trials attempted across search space (A-11 pinned)
  dsr_trial_count_basis: "TOTAL_ATTEMPTED_TRIALS"
  # Sharpe ratio sample variance divisor convention: evaluated trials minus one (N_eval - 1)
  dsr_sharpe_variance_divisor: "EVALUATED_TRIALS_MINUS_ONE"
  # Number of trading sessions per year for Sharpe annualization (NSE cash market convention)
  sessions_per_year: 250
  # Kurtosis calculation convention: RAW_NORMAL_THREE (standard normal kurtosis = 3.0)
  kurtosis_convention: "RAW_NORMAL_THREE"
  # Haircut Sharpe ratio adjustment methodology: BONFERRONI (Harvey & Liu family-wise error rate)
  haircut_variant: "BONFERRONI"
  # Minimum number of out-of-sample trades across evaluation sample
  min_total_trades: 100
  # Maximum allowable annual portfolio turnover
  max_annual_turnover: "12.0"
  # Walk-forward parameter stability: Minimum proportion of walk-forward test folds with positive Sharpe
  min_positive_walk_forward_fold_ratio: "0.80"
  # Audit §77.13 (1.1.7): in-sample stability from the run's own ledger — at least 3 of the 4 anchored
  # expanding folds must be positive, and each counted fold's liquidated PF must clear this floor.
  min_positive_is_fold_ratio: "0.75"
  min_fold_liquidated_pf: "1.30"

risk_and_drawdown_limits:
  # Maximum portfolio drawdown allowable on closed + open positions
  max_portfolio_drawdown: "0.25"
  # Maximum drawdown duration in trading sessions
  max_drawdown_duration_sessions: 125
  # Minimum win/loss ratio (gross profit / gross loss)
  min_profit_factor: "1.50"
  # Audit §77.12 item 4 (1.1.7): the same ratio with its single largest winner removed
  min_liquidated_pf_ex_top_1: "1.40"
  # Maximum single-stock capital allocation at trade entry
  max_single_position_weight: "0.10"

execution_and_liquidity_realism:
  # Maximum volume participation per session (fraction of actual TOTTRDQTY)
  max_volume_participation_cap: "0.03"
  # Minimum Average Daily Traded Value (Turnover) required for instrument eligibility (₹ in Crore)
  min_daily_turnover_crore: "5.0"
  # Circuit filter fill restriction: Prohibit BUY at Upper Circuit (ask depth = 0)
  prohibit_buy_at_upper_circuit: true
  # Circuit filter fill restriction: Prohibit SELL / Stop-Loss fill at Lower Circuit (bid depth = 0)
  prohibit_sell_at_lower_circuit: true
  # Execution latency: Earliest execution fill session relative to signal calculation session T
  min_execution_latency_sessions: 1
  # Maximum holding period, in authoritative NSE calendar sessions counted from the entry session
  # (Audit §90.9 item 4, AGENTS.md §13.2). A delivery position may not be carried past this many
  # sessions, so no held position crosses an unadjusted corporate-action ex-date without the action
  # being applied to it. `Position.require_within_hold_bound` refuses the hold; a hold that cannot
  # exit inside the bound because the bid is locked at the lower circuit is a refusal, never a silent
  # extension (§5.3). Declared before any run and used only on the training/validation windows.
  max_hold_trading_sessions: 21
  # Audit §74.10 Ruling D — the unbanded-session fill policy in force, pre-registered before seq 8.
  # NSE publishes the band *code* in a single rolling sec_list.csv that is overwritten in place, and
  # the bhavcopy carries no band column, so no daily 2022-2023 band history exists to source: H-83 as
  # written admits 3 of 179 instruments and returns a criterion that has never been computed.
  # LOCKED_BAR_REFUSAL_ONLY therefore narrows the requirement, not the window: an instrument-session
  # with no attested band fills at the usual T+1 open plus the existing slippage and statutory-cost
  # model, UNLESS the session bar is locked (high == low, zero depth on one side), which is refused on
  # both sides (§5.3). No band and no circuit limit is ever synthesized from a price, and
  # CRIT-EXEC-03/CRIT-EXEC-04 remain NOT RUN over unsourced sessions — the policy does not claim to
  # know whether a non-locked open sat at a limit. This is an assumption about fills, not a threshold:
  # setting STRICT_BAND_REQUIRED restores H-83 exactly (no band, no entry and no exit).
  unbanded_session_fill_policy: "LOCKED_BAR_REFUSAL_ONLY"

  # Audit §75.10 N-137 — the entry selection rule, pre-registered before seq 9. `NONE` is the
  # alphabetical-ISIN order every prior trial used; `mom_63` ranks the session's qualifying entries by
  # 63-session trailing close return, descending, with an ascending `isin` tie-break, so the capital
  # slots go to the strongest names instead of the lexicographically first ones. This is not a
  # threshold: it changes which signal gets a slot, and it is recorded in `canonical_params`.
  entry_rank_indicator: "mom_63"

  # Audit §75.10 N-138 — minimum economically viable order sizes (₹). An entry whose notional is below
  # `min_entry_notional` is a named no-trade instead of a booked micro-position, and a BUY fill that
  # lands below `min_fill_notional` is refused rather than booked. At ₹20 per order, statutory cost on
  # the sub-₹5,000 decile measured 12-82% of notional (§75.8). Exits are never refused by this floor:
  # a frozen exit is an unbounded hold (§5.3, §13.2).
  min_entry_notional: "25000"
  min_fill_notional: "5000"

statutory_indian_cost_schedule:
  # Audit §95.10 items 1-2 (criteria 1.1.16): the re-ratable levies are half-open interval tables, not
  # scalars, and each row carries the sha256 of the committed source that states it. A scalar cannot
  # represent a levy that moved inside the 2018-04-01..2023-12-29 window, and three of them did:
  #   SEBI broker turnover fee — halved for 2020-06-01..2021-03-31 (SEBI/LAD-NRO/GN/2020/011);
  #   stamp duty — state schedules until 2020-06-30, uniform Indian Stamp Act rates from 2020-07-01;
  #   exchange turnover charge — five NSE/FA circulars, now each with committed bytes.
  # The source payloads live under data/raw/circulars/<source_ref>/ with their own manifest.json
  # (source_url, retrieved_at, byte_count, sha256). `scripts/ingest_statutory_sources.py --check`
  # reproduces them, and `scripts/run_seq10_candidate.statutory_cost_schedule_problem` refuses a row
  # whose digest resolves to no committed byte.
  gst_rate: "0.18"                         # 18% applied to taxable financial services
  brokerage_per_order_inr: "20.00"         # Default flat brokerage per executed order
  # GST taxable services base explicitly includes IPFT alongside brokerage, exchange, and SEBI charges
  gst_taxable_base_components:
    - "brokerage"
    - "exchange_turnover"
    - "sebi_turnover"
    - "ipft"

  # Effective-dated historical fee schedule for NSE cash equity segment
  effective_dated_exchange_fees:
    # The pre-2021 rate has no circular of its own in NSE's index: no cash-market transaction-charge
    # revision was published between 2008 and 2020 (queried 2016-2020, 83 FA circulars, none amending
    # the cash schedule). NSE/FA/46730 states it as the "Existing Transaction Charges" column that its
    # own ₹3.45/lakh revision replaced from 2021-01-01, and NSE/FA/45147 and NSE/FA/46225 each say the
    # securities outside their 2020 concessions "continue to be charged as per the existing transaction
    # charges structure". Those three committed circulars are the evidence for this row.
    - circular_ref: "NSE/FA/46730"
      from_date: "2018-04-01"
      to_date: "2020-12-31"
      exchange_turnover_rate: "0.0000325"  # Slab 1 rate (₹325 per crore), the "Existing" column
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      circular_sha256: "a9ff85ab4deec82e02bb1e3fc213a2bbc02a72e9edb7b36cdf1568aeb792febf"
      supporting_refs: ["NSE/FA/45147", "NSE/FA/46225"]
      description: >-
        Pre-2021 cash-market turnover charge, ₹3.25/lakh (₹325/cr) slab 1 with ₹0.01/cr IPFT. The rate
        is attested by NSE/FA/46730 (2020-12-18, effective 2021-01-01) as the charge it replaced, and by
        NSE/FA/45147 (2020-07-27) and NSE/FA/46225 (2020-10-30), which continue the same structure for
        securities outside their temporary concessions. The 2020 concessions themselves (2.75/1.75 per
        lakh for EQ non-index, non-GSM stocks, 2020-08-01 onward) are NOT modelled — see
        configs/statutory_rate_decisions.yaml; slab 1 is the disclosed conservative overstatement.

    - circular_ref: "NSE/FA/46730"
      from_date: "2021-01-01"
      to_date: "2023-03-31"
      exchange_turnover_rate: "0.0000345"  # Slab 1 rate (₹345 per crore)
      ipft_rate: "0.000000001"             # ₹0.01 per crore
      circular_sha256: "a9ff85ab4deec82e02bb1e3fc213a2bbc02a72e9edb7b36cdf1568aeb792febf"
      description: "Pre-April 2023 turnover slabs + baseline IPFT (NSE/FA/46730, effective 2021-01-01)"

    - circular_ref: "NSE/FA/56129"
      from_date: "2023-04-01"
      to_date: "2024-03-31"
      exchange_turnover_rate: "0.0000325"  # 6% rollback rate (₹325 per crore)
